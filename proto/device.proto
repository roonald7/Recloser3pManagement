syntax = "proto3";

package device;

service DeviceService {
  rpc GetServiceTree(ServiceTreeRequest) returns (ServiceTreeResponse);
  rpc CompareServiceTrees(CompareServiceTreesRequest)
      returns (CompareServiceTreesResponse);
  rpc GetScreenLayout(ScreenLayoutRequest) returns (ScreenLayoutResponse);
  rpc GetFullInventory(FullInventoryRequest) returns (FullInventoryResponse);

  // CRUD Operations
  rpc CreateDevice(DeviceRecord) returns (GenericResponse);
  rpc UpdateDevice(DeviceRecord) returns (GenericResponse);
  rpc DeleteDevice(DeleteRequest) returns (GenericResponse);

  rpc CreateFirmware(FirmwareRecord) returns (GenericResponse);
  rpc UpdateFirmware(FirmwareRecord) returns (GenericResponse);
  rpc DeleteFirmware(DeleteRequest) returns (GenericResponse);

  rpc AddServiceNode(ServiceRecord) returns (GenericResponse);
  rpc UpdateServiceNode(ServiceRecord) returns (GenericResponse);
  rpc DeleteServiceNode(DeleteRequest) returns (GenericResponse);

  rpc CreateFeature(FeatureRecord) returns (GenericResponse);
  rpc UpdateFeature(FeatureRecord) returns (GenericResponse);
  rpc DeleteFeature(DeleteRequest) returns (GenericResponse);

  rpc GetLanguages(LanguagesRequest) returns (LanguagesResponse);
  rpc GetDeviceInformation(DeviceInformationRequest)
      returns (DeviceInformationResponse);
  rpc ComparePhysicalDevices(ComparePhysicalDevicesRequest)
      returns (ComparePhysicalDevicesResponse);
  rpc GetAllPhysicalDevices(GetAllPhysicalDevicesRequest)
      returns (GetAllPhysicalDevicesResponse);
}

message DeviceInformationRequest {}

message FirmwareInfoProto {
  int32 id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
}

message ModelInfoProto {
  int32 id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
  repeated FirmwareInfoProto firmwares = 4;
}

message DeviceInfoProto {
  int32 id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
  repeated ModelInfoProto models = 4;
}

message DeviceInformationResponse { repeated DeviceInfoProto devices = 1; }

message GenericResponse {
  bool success = 1;
  string message = 2;
}

message DeleteRequest { int32 id = 1; }

message DeviceRecord {
  int32 id = 1;
  string description_key = 2;
}

message FirmwareRecord {
  int32 id = 1;
  string description_key = 2;
  int32 model_id = 3;
}

message ServiceRecord {
  int32 id = 1;
  string description_key = 2;
  int32 parent_id = 3;
}

message FeatureRecord {
  int32 id = 1;
  string description_key = 2;
  int32 service_model_firmware_id = 3;
}

message LanguagesRequest {}

message Language {
  string code = 1;
  string name = 2;
}

message LanguagesResponse { repeated Language languages = 1; }

message FullInventoryRequest {}

message FirmwareInventory {
  int32 id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
  repeated ServiceNode services = 4;
}

message ModelInventory {
  int32 id = 1;
  string description_key = 3;
  repeated Translation translations = 4;
  repeated FirmwareInventory firmwares = 5;
}

message DeviceInventory {
  int32 id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
  repeated ModelInventory models = 4;
}

message FullInventoryResponse { repeated DeviceInventory devices = 1; }

message ServiceTreeRequest {
  int32 device_id = 1;
  int32 model_id = 2;
  int32 firmware_id = 3;
}

message Feature {
  int32 id = 1;
  string feature_key = 2;
  repeated Translation translations = 3;
}

message ServiceNode {
  int32 id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
  repeated Feature features = 4;
  repeated ServiceNode children = 5;
}

message ServiceTreeResponse { repeated ServiceNode top_level_services = 1; }

// Comparison messages
message CompareServiceTreesRequest {
  int32 device_model_firmware_id_1 = 1;
  int32 device_model_firmware_id_2 = 2;
  string language_code = 3;
}

enum DifferenceType {
  ADDED = 0;
  REMOVED = 1;
  MODIFIED = 2;
  UNCHANGED = 3;
}

message ServiceDifference {
  string description_key = 1;
  string display_name = 2;
  DifferenceType difference_type = 3;
  repeated FeatureDifference feature_differences = 4;
  repeated ServiceDifference child_differences = 5;
}

message FeatureDifference {
  string feature_name = 1;
  string description = 2;
  DifferenceType difference_type = 3;
}

message CompareServiceTreesResponse {
  int32 device_model_firmware_id_1 = 1;
  int32 device_model_firmware_id_2 = 2;
  repeated ServiceDifference differences = 3;
  string summary = 4; // e.g., "5 services added, 2 removed, 3 modified"
}

message ScreenLayoutRequest {
  int32 device_id = 1;
  int32 model_id = 2;
  int32 firmware_id = 3;
  int32 service_id = 4;
  int64 physical_device_id = 5;
}

message ComponentLimit {
  string key = 1;   // e.g., "MIN_VALUE"
  string value = 2; // e.g., "0"
}

message Translation {
  string language_code = 1;
  string value = 2;
}

message ComponentOption {
  string value = 1;
  repeated Translation translations = 2;
}

message FeatureComponentDetail {
  int32 feature_id = 1;
  string feature_key = 2;
  repeated Translation translations = 3;
  string component_type = 4;
  repeated ComponentLimit limits = 5;
  repeated FeatureComponentDetail children = 6;
  repeated ComponentOption options = 7; // Includes ON/OFF labels for toggles
  string value = 8; // Saved value for a specific physical device
}

message ServiceLayout {
  int32 service_id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
  repeated FeatureComponentDetail features = 4;
  repeated ServiceLayout children = 5;
}

message ScreenLayoutResponse { ServiceLayout service_layout = 1; }

message PhysicalDevice {
  int64 id = 1;
  string name = 2;
  int32 device_id = 3;
  int32 model_id = 4;
  int32 firmware_version_id = 5;
  string identifier = 6;
  string description = 7;
  string comment = 8;
  bool is_template = 9;
}

message ComparePhysicalDevicesRequest {
  int64 physical_device_id_1 = 1;
  int64 physical_device_id_2 = 2;
  string language_code = 3;
}

message PhysicalDeviceFeatureComparison {
  int32 feature_id = 1;
  string feature_key = 2;
  repeated Translation translations = 3;
  string value_1 = 4;
  string value_2 = 5;
  bool is_different = 6;
}

message PhysicalDeviceServiceComparison {
  int32 service_id = 1;
  string description_key = 2;
  repeated Translation translations = 3;
  repeated PhysicalDeviceFeatureComparison features = 4;
  repeated PhysicalDeviceServiceComparison children = 5;
  bool has_differences = 6;
}

message ComparePhysicalDevicesResponse {
  int64 physical_device_id_1 = 1;
  int64 physical_device_id_2 = 2;
  repeated PhysicalDeviceServiceComparison root_services = 3;
}

message GetAllPhysicalDevicesRequest {}

message GetAllPhysicalDevicesResponse {
  repeated PhysicalDevice physical_devices = 1;
}

service RecordService {
  rpc GetAllRecords(GetAllRecordsRequest) returns (GetAllRecordsResponse);
}

message GetAllRecordsRequest { string language_code = 1; }

message PhysicalDeviceRecordDetailed {
  int64 id = 1;
  string name = 2;
  string identifier = 3;
  string device_name = 4;
  string model_name = 5;
  string firmware_name = 6;
  repeated PhysicalDeviceValue values = 7;
}

message GetAllRecordsResponse {
  repeated PhysicalDeviceRecordDetailed records = 1;
}

message PhysicalDeviceValue {
  int32 feature_id = 1;
  string feature_key = 2;
  repeated Translation translations = 3;
  string value = 4;
}
