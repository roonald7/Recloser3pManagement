syntax = "proto3";

package device;

service DeviceService {
  rpc GetServiceTree(ServiceTreeRequest) returns (ServiceTreeResponse);
  rpc CompareServiceTrees(CompareServiceTreesRequest)
      returns (CompareServiceTreesResponse);
  rpc GetScreenLayout(ScreenLayoutRequest) returns (ScreenLayoutResponse);
  rpc GetFullInventory(FullInventoryRequest) returns (FullInventoryResponse);

  // CRUD Operations
  rpc CreateLine(LineRecord) returns (GenericResponse);
  rpc UpdateLine(LineRecord) returns (GenericResponse);
  rpc DeleteLine(DeleteRequest) returns (GenericResponse);

  rpc CreateFirmware(FirmwareRecord) returns (GenericResponse);
  rpc UpdateFirmware(FirmwareRecord) returns (GenericResponse);
  rpc DeleteFirmware(DeleteRequest) returns (GenericResponse);

  rpc AddServiceNode(ServiceRecord) returns (GenericResponse);
  rpc UpdateServiceNode(ServiceRecord) returns (GenericResponse);
  rpc DeleteServiceNode(DeleteRequest) returns (GenericResponse);

  rpc CreateFeature(FeatureRecord) returns (GenericResponse);
  rpc UpdateFeature(FeatureRecord) returns (GenericResponse);
  rpc DeleteFeature(DeleteRequest) returns (GenericResponse);

  rpc CreateScreenFeature(ScreenFeatureRecord) returns (GenericResponse);
  rpc UpdateScreenFeature(ScreenFeatureRecord) returns (GenericResponse);
  rpc DeleteScreenFeature(DeleteRequest) returns (GenericResponse);

  rpc GetLanguages(LanguagesRequest) returns (LanguagesResponse);
  rpc GetLineInformation(LineInformationRequest)
      returns (LineInformationResponse);

  rpc ListLineDevices(ListLineDevicesRequest) returns (ListLineDeviceResponse);

  rpc GetDevices(GetDevicesRequest) returns (GetDevicesResponse);
  rpc CreateDevice(CreateDeviceRequest) returns (CreateDeviceResponse);
  rpc UpdateDevice(UpdateDeviceRequest) returns (GenericResponse);
  rpc DeleteDevice(DeleteDeviceRequest) returns (GenericResponse);

  rpc CompareDevices(CompareDevicesRequest) returns (CompareDevicesResponse);
  rpc GetAllDevices(GetAllDevicesRequest) returns (GetAllDevicesResponse);
  rpc CreateFullLine(CreateFullLineRequest) returns (CreateFullLineResponse);
}

message LineInformationRequest {}

message FirmwareInfoProto {
  int32 id = 1;
  LocalizedText info = 2;
}

message ModelInfoProto {
  int32 id = 1;
  LocalizedText info = 2;
  repeated FirmwareInfoProto firmwares = 3;
}

message LineInfoProto {
  int32 id = 1;
  LocalizedText info = 2;
  repeated ModelInfoProto models = 3;
}

message LineInformationResponse { repeated LineInfoProto lines = 1; }

message GenericResponse {
  bool success = 1;
  string message = 2;
}

message DeleteRequest { int32 id = 1; }

message LineRecord {
  int32 id = 1;
  string description_key = 2;
}

message FirmwareRecord {
  int32 id = 1;
  string description_key = 2;
  int32 model_id = 3;
}

message ServiceRecord {
  int32 id = 1;
  string description_key = 2;
  int32 parent_id = 3;
}

message FeatureRecord {
  int32 id = 1;
  string key = 2;
}

message ScreenFeatureRecord {
  int32 id = 1;
  int32 service_model_firmware_id = 2;
  int32 feature_id = 3;
  string description_key = 4;
  int32 parent_screen_feature_id = 5;
}

message LanguagesRequest {}

message Language {
  string code = 1;
  string name = 2;
}

message LanguagesResponse { repeated Language languages = 1; }

message FullInventoryRequest {}

message FirmwareInventory {
  int32 id = 1;
  LocalizedText info = 2;
  repeated ServiceNode services = 3;
}

message ModelInventory {
  int32 id = 1;
  LocalizedText info = 2;
  repeated FirmwareInventory firmwares = 3;
}

message LineInventory {
  int32 id = 1;
  LocalizedText info = 2;
  repeated ModelInventory models = 3;
}

message FullInventoryResponse { repeated LineInventory lines = 1; }

message ServiceTreeRequest {
  int32 line_id = 1;
  int32 model_id = 2;
  int32 firmware_id = 3;
}

message Feature {
  int32 id = 1;
  LocalizedText info = 2;
}

message ServiceNode {
  int32 id = 1;
  LocalizedText info = 2;
  repeated Feature features = 3;
  repeated ServiceNode children = 4;
}

message ServiceTreeResponse { repeated ServiceNode top_level_services = 1; }

// Comparison messages
message CompareServiceTreesRequest {
  int32 device_model_firmware_id_1 = 1;
  int32 device_model_firmware_id_2 = 2;
  string language_code = 3;
}

enum DifferenceType {
  UNCHANGED = 0;
  ADDED = 1;
  REMOVED = 2;
  MODIFIED = 3;
}

message ServiceDifference {
  LocalizedText info = 1;
  DifferenceType difference_type = 2;
  repeated FeatureDifference feature_differences = 3;
  repeated ServiceDifference child_differences = 4;
}

message FeatureDifference {
  string feature_name = 1;
  string description = 2;
  DifferenceType difference_type = 3;
}

message CompareServiceTreesResponse {
  int32 device_model_firmware_id_1 = 1;
  int32 device_model_firmware_id_2 = 2;
  repeated ServiceDifference differences = 3;
  string summary = 4; // e.g., "5 services added, 2 removed, 3 modified"
}

message ScreenLayoutRequest {
  int32 line_id = 1;
  int32 model_id = 2;
  int32 firmware_id = 3;
  int32 service_id = 4;
  int64 device_id = 5;
}

message ComponentLimit {
  string key = 1;   // e.g., "MIN_VALUE"
  string value = 2; // e.g., "0"
}

message Translation {
  string language_code = 1;
  string value = 2;
}

message LocalizedText {
  string description_key = 1;
  repeated Translation translations = 2;
}

message ComponentOption {
  string value = 1;
  repeated Translation translations = 2;
}

message FeatureComponentDetail {
  int32 feature_id = 1;
  LocalizedText info = 2;
  string component_type = 3;
  repeated ComponentLimit limits = 4;
  repeated FeatureComponentDetail children = 5;
  repeated ComponentOption options = 6; // Includes ON/OFF labels for toggles
  string value = 7;                     // Saved value for a specific device
}

message ServiceLayout {
  int32 service_id = 1;
  LocalizedText info = 2;
  repeated FeatureComponentDetail features = 3;
  repeated ServiceLayout children = 4;
}

message ScreenLayoutResponse { ServiceLayout service_layout = 1; }

message DeviceInfo {
  int64 id = 1;
  string name = 2;
  int32 model_firmware_id = 3;
  string identifier = 4;
  string description = 5;
  string comment = 6;
  bool is_template = 7;
  LocalizedText model = 8;
  LocalizedText firmware = 9;
}

message CompareDevicesRequest {
  int64 device_id_1 = 1;
  int64 device_id_2 = 2;
}

message DeviceFeatureComparison {
  int32 feature_id = 1;
  LocalizedText info = 2;
  string value_1 = 3;
  string value_2 = 4;
  bool is_different = 5;
  DifferenceType difference_type = 6;
  string difference_note = 7;
  repeated ComponentOption options = 8;
}

message DeviceServiceComparison {
  int32 service_id = 1;
  LocalizedText info = 2;
  repeated DeviceFeatureComparison features = 3;
  repeated DeviceServiceComparison children = 4;
  bool has_differences = 5;
}

message CompareDevicesResponse {
  int64 device_id_1 = 1;
  int64 device_id_2 = 2;
  repeated DeviceServiceComparison root_services = 3;
}

message CreateDeviceRequest {
  string name = 1;
  int32 model_id = 2;
  int32 firmware_id = 3;
  string identifier = 4;
  string description = 5;
  string comment = 6;
  bool is_template = 7;
}

message CreateDeviceResponse {
  bool success = 1;
  string message = 2;
  int64 id = 3;
}

message GetAllDevicesRequest {}

message GetAllDevicesResponse { repeated DeviceInfo devices = 1; }

message GetDevicesRequest { int64 device_id = 1; }

message GetDevicesResponse { repeated DeviceInfo devices = 1; }

message UpdateDeviceRequest { DeviceInfo device = 1; }

message DeleteDeviceRequest { int64 id = 1; }

service RecordService {
  rpc GetAllRecords(GetAllRecordsRequest) returns (GetAllRecordsResponse);
  rpc ListDeviceRecords(ListDeviceRecordsRequest)
      returns (ListDeviceRecordsResponse);
  rpc SaveDeviceRecord(SaveDeviceRecordRequest) returns (GenericResponse);
  rpc CompareRecords(CompareRecordsRequest) returns (CompareRecordsResponse);
}

message GetAllRecordsRequest {}

message ListDeviceRecordsRequest { int64 device_id = 1; }

message ListDeviceRecordsResponse { repeated DeviceRecordDetailed records = 1; }

message CompareRecordsRequest {
  int64 record_id_1 = 1;
  int64 record_id_2 = 2;
}

message CompareRecordsResponse {
  int64 record_id_1 = 1;
  int64 record_id_2 = 2;
  repeated DeviceServiceComparison root_services = 3;
}

message SaveDeviceRecordRequest {
  int64 device_id = 1;
  repeated RecordValue values = 2;
}

message RecordValue {
  int32 feature_id = 1;
  string value = 2;
}

message DeviceRecordDetailed {
  int64 id = 1; // Record ID
  int64 device_id = 2;
  string name = 3;
  string identifier = 4;
  LocalizedText line = 5;
  LocalizedText model = 6;
  LocalizedText firmware = 7;
  repeated DeviceValue values = 8;
  string created_at = 9;
}

message GetAllRecordsResponse { repeated DeviceRecordDetailed records = 1; }

message DeviceValue {
  int32 feature_id = 1;
  LocalizedText info = 2;
  string value = 3;
}

message FirmwareCreateRequest {
  string description_key = 1;
  repeated Translation translations = 2;
}

message ModelCreateRequest {
  string description_key = 1;
  repeated Translation translations = 2;
  repeated FirmwareCreateRequest firmwares = 3;
}

message CreateFullLineRequest {
  string description_key = 1;
  repeated Translation translations = 2;
  repeated ModelCreateRequest models = 3;
}

message CreateFullLineResponse {
  bool success = 1;
  string message = 2;
  LineInfoProto line = 3;
}

message ListLineDevicesRequest { int32 line_id = 1; }

message ListLineDeviceResponse { repeated DeviceInfo devices = 1; }
